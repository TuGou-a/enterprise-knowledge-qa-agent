spring.application.name=backend

# 真实模式必填；由终端、IDE 或容器注入，Spring Boot 不自动加载根目录 .env。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_agent}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:knowledge_agent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:2000}
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.sql.init.mode=never
mybatis.mapper-locations=classpath*:mapper/knowledge/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# JDBC 单位为秒；T03 还须按每次剩余预算收紧，不足一秒时不启动新查询。
mybatis.configuration.default-statement-timeout=5

knowledge-agent.deepseek.api-key=${DEEPSEEK_API_KEY:}
knowledge-agent.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
knowledge-agent.deepseek.model=${DEEPSEEK_MODEL:deepseek-flash}
# 应用分配的保守窗口初值，不表示已核实服务商上下文上限。
knowledge-agent.deepseek.context-window=${DEEPSEEK_CONTEXT_WINDOW:32768}
knowledge-agent.deepseek.max-output-tokens=${DEEPSEEK_MAX_OUTPUT_TOKENS:2048}
knowledge-agent.siliconflow.api-key=${SILICONFLOW_API_KEY:}
knowledge-agent.siliconflow.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
knowledge-agent.siliconflow.embedding-model=${EMBEDDING_MODEL:BAAI/bge-m3}
knowledge-agent.siliconflow.rerank-model=${RERANK_MODEL:BAAI/bge-reranker-v2-m3}

knowledge-agent.retrieval.route-limit=${RETRIEVAL_ROUTE_LIMIT:20}
knowledge-agent.retrieval.candidate-pool-limit=${RETRIEVAL_POOL_LIMIT:20}
knowledge-agent.retrieval.primary-limit=${RETRIEVAL_PRIMARY_LIMIT:6}
knowledge-agent.retrieval.related-limit=${RETRIEVAL_RELATED_LIMIT:12}
knowledge-agent.retrieval.rrf-k=${RETRIEVAL_RRF_K:60}
knowledge-agent.retrieval.preview-characters=${RETRIEVAL_PREVIEW_CHARACTERS:300}

knowledge-agent.limits.question-characters=${QA_QUESTION_CHARACTERS:2000}
knowledge-agent.limits.history-messages=${QA_HISTORY_MESSAGES:20}
knowledge-agent.limits.history-message-characters=${QA_HISTORY_MESSAGE_CHARACTERS:4000}
knowledge-agent.limits.history-characters=${QA_HISTORY_CHARACTERS:12000}
knowledge-agent.limits.query-characters=${QA_QUERY_CHARACTERS:512}
knowledge-agent.limits.model-input-characters=${QA_MODEL_INPUT_CHARACTERS:24000}
knowledge-agent.limits.read-characters=${QA_READ_CHARACTERS:20000}
knowledge-agent.limits.tool-text-characters=${QA_TOOL_TEXT_CHARACTERS:24000}
knowledge-agent.limits.embedding-batch-size=${EMBEDDING_BATCH_SIZE:32}
knowledge-agent.limits.embedding-text-characters=${EMBEDDING_TEXT_CHARACTERS:4000}
knowledge-agent.limits.rerank-characters=${RERANK_CHARACTERS:64000}
knowledge-agent.limits.react-iterations=${QA_REACT_ITERATIONS:6}
knowledge-agent.limits.tool-calls=${QA_TOOL_CALLS:12}

knowledge-agent.timeouts.request-ms=${QA_REQUEST_TIMEOUT_MS:120000}
knowledge-agent.timeouts.model-ms=${MODEL_TIMEOUT_MS:60000}
knowledge-agent.timeouts.tool-ms=${TOOL_TIMEOUT_MS:30000}
knowledge-agent.timeouts.embedding-ms=${EMBEDDING_TIMEOUT_MS:15000}
knowledge-agent.timeouts.rerank-ms=${RERANK_TIMEOUT_MS:10000}
knowledge-agent.timeouts.database-ms=${DATABASE_TIMEOUT_MS:5000}
knowledge-agent.timeouts.connection-ms=${DB_CONNECTION_TIMEOUT_MS:2000}

knowledge-agent.index.preprocessing-version=${INDEX_PREPROCESSING_VERSION:source-preserving-v1}
knowledge-agent.index.tokenizer-version=${JIEBA_TOKENIZER_VERSION:jieba-analysis-1.0.2}
knowledge-agent.index.dictionary-version=${JIEBA_DICTIONARY_VERSION:builtin-v1}
knowledge-agent.index.stop-words-version=${JIEBA_STOP_WORDS_VERSION:none-v1}
# 空路径表示内置词典与不启用额外停用词；外部资源由 T04 加载并校验。
knowledge-agent.index.dictionary-location=${JIEBA_DICTIONARY_LOCATION:}
knowledge-agent.index.stop-words-location=${JIEBA_STOP_WORDS_LOCATION:}
